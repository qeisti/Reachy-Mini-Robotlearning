[pytest]
# Only collect real tests; scripts/test_expressions.py is a CLI tool, not a test.
testpaths = tests
# ROS 2 (sourced via PYTHONPATH) registers pytest plugins that fail to import
# inside this venv (missing 'lark'). Disable them; no-op where ROS is absent.
addopts = -p no:launch_testing -p no:launch_ros
